name: Offline build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Validate AWS CPU deployment contract
        shell: bash
        run: |
          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT
          cat >"$runtime_env" <<'EOF'
          GROQ_API_KEY=dummy
          OPENROUTER_API_KEY=dummy
          PINECONE_API_KEY=dummy
          POSTGRES_PASSWORD=0123456789abcdef
          PROVIDER_ORDER=groq,openrouter
          PINECONE_INDEX_NAME=agentic-rag-hybrid-v2
          V3_INDEX_NAME=agentic-rag-hybrid-v3
          EOF
          export APP_RUNTIME_ENV_FILE="$runtime_env"
          export POSTGRES_PASSWORD=0123456789abcdef
          docker compose \
            --env-file "$runtime_env" \
            -f deploy/aws/compose.yml \
            config --quiet
          bash -n \
            deploy/aws/bootstrap.sh \
            deploy/aws/manage.sh \
            deploy/aws/preflight.sh
          python -m json.tool \
            deploy/aws/iam-parameter-policy.template.json \
            >/dev/null

      - name: Build locked CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: agentic-rag-ci:local
          target: cpu-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Check runtime imports and CPU PyTorch
        run: |
          docker run --rm --network none agentic-rag-ci:local \
            python -c 'import torch; from pinecone import Pinecone; assert torch.version.cuda is None; print(torch.__version__)'

      - name: Verify baked models without network access
        run: |
          docker run --rm --network none agentic-rag-ci:local \
            python scripts/cache_models.py --verify-only

      - name: Verify baked BM25 tokenizer data without network access
        run: |
          docker run --rm --network none agentic-rag-ci:local \
            python scripts/cache_nltk.py --verify-only

      - name: Verify pinned V3 parser runtime without network access
        run: |
          docker run --rm --network none agentic-rag-ci:local \
            python scripts/verify_v3_parser_runtime.py

      - name: Run offline unit suite
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            agentic-rag-ci:local \
            python -m pytest -p no:cacheprovider tests/unit
